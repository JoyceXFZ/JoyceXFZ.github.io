<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Joyce Zheng</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: #222;
      background: #fff;
      height: 100%;
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    main {
      max-width: 420px;
      width: 95%;
      padding: 2.5rem 1.5rem;
      margin: 2rem auto;
      background: #fafafa;
      border-radius: 10px;
      box-shadow: 0 6px 32px rgba(0,0,0,0.07);
      text-align: center;
    }

    header h1 {
      margin: 0 0 0.2em 0;
      font-size: 2.2em;
      font-weight: bold;
      letter-spacing: 0.02em;
    }

    .subtitle {
      color: #888;
      font-size: 1em;
      margin-bottom: 1.2em;
    }

    .bio {
      margin-bottom: 2em;
      color: #333;
      font-size: 1.08em;
      line-height: 1.6;
    }

    .links {
      display: flex;
      gap: 1.5em;
      justify-content: center;
      flex-wrap: wrap;
    }

    .links a {
      text-decoration: none;
      color: #3572a5;
      font-weight: 500;
      border-bottom: 1px dotted #aaa;
      transition: border-bottom 0.2s, color 0.2s;
    }

    .links a:hover {
      color: #1b497a;
      border-bottom: 1px solid #3572a5;
    }

    /* Responsive for mobile */
    @media (max-width: 500px) {
      main {
        padding: 1.5rem 0.5rem;
      }

      header h1 {
        font-size: 1.8em;
      }

      .links {
        gap: 1em;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Joyce Zheng</h1>
      <p class="subtitle">Developer & Problem Solver</p>
    </header>
    
    <section class="bio">
      <p>
        I'm a full-stack developer passionate about building clean, user-friendly applications.
        I enjoy exploring new technologies and solving complex problems through code.
      </p>
    </section>
    
    <section class="links">
      <a href="https://github.com/JoyceXFZ" target="_blank">GitHub</a>
      <a href="https://linkedin.com" target="_blank">LinkedIn</a>
      <a href="mailto:your.email@example.com">Email</a>
    </section>
  </main>
</body>
</html>
